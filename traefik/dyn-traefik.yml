http:
  middlewares:
    # used to protect preprod to prevent it being on Google
    preprod-users:
      basicAuth:
        removeHeader: true
        users:
          # gen'd by : sudo apt install apache2-utils && htpasswd -nB preprod
          - "preprod:$2y$05$Xl.j/6a3Nbg9SCl/5BIK/O.71EDe/svgdkpV7h4iHkPPLVkBhL2Zu"
    prod-users:
      basicAuth:
        removeHeader: true
        users:
          # gen'd by : sudo apt install apache2-utils && htpasswd -nB preprod
          - "prod:$2y$05$Zij5ienb.EdFA0ma98SBf.BljqMvQWmufgMCV3vwWe6o6OH8ec..G"
        
# TODO rm since no paid cert in prod ?
tls:
  stores:
    default:
      defaultCertificate:
        # dev (localhost dev cert generated by mkcert)
        certFile: /etc/ssl/traefik/localhost-dev-cert.pem
        keyFile: /etc/ssl/traefik/localhost-dev-key.pem
        # preprod (auto generated cert by letsencrypt)
        #certFile: /etc/ssl/traefik/cert.pem
        #keyFile: /etc/ssl/traefik/privkey.pem
        # prod (if paid cert)
        #certFile: /etc/certs/certificate.crt
        #keyFile: /etc/certs/private.key

  certificates:
    # dev (localhost dev cert generated by mkcert)
    - certFile: /etc/ssl/traefik/localhost-dev-cert.pem
      keyFile: /etc/ssl/traefik/localhost-dev-key.pem
    # preprod (auto generated cert by letsencrypt)
    #certFile: /etc/ssl/traefik/cert.pem
    #keyFile: /etc/ssl/traefik/privkey.pem
    # prod (if paid cert)
    #- certFile: /etc/certs/certificate.crt
    #  keyFile: /etc/certs/private.key

